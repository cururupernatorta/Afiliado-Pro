name: Release

# Builda o instalador Windows e publica como GitHub Release a cada push na
# main — mas só quando a versão em package.json muda. Sem isso, todo commit
# tentaria publicar a mesma versão de novo e falharia (ou pisaria na release
# anterior). Pra lançar uma atualização: dê um bump em "version" no
# package.json antes de mergear/dar push na main. O electron-updater
# (já configurado no app) detecta a nova release sozinho.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verifica se essa versão já foi publicada (e está completa)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Não basta a release existir: já aconteceu de o electron-builder subir só
          # o .blockmap e falhar antes do .exe/latest.yml, e mesmo assim o job terminar
          # verde. Sem latest.yml o auto-updater nunca acha essa versão. Por isso o teste
          # de "já publicado" exige latest.yml presente, não só a release existir.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.yml'; then
            echo "Release v$VERSION já existe e está completa (latest.yml presente) — nada a publicar."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Versão v$VERSION não publicada ainda (ou release incompleta, sem latest.yml). Vou buildar e publicar."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    # Fixo em windows-2022 (não windows-latest): a imagem mais nova do runner
    # já vem com uma versão do Visual Studio que o node-gyp (usado pelo
    # better-sqlite3 pra compilar o módulo nativo) ainda não reconhece,
    # e a build falha com "could not find a version of Visual Studio to use"
    # mesmo com o VS instalado. windows-2022 tem o VS 2022 reconhecido.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Build (renderer + main)
        run: npm run build

      # Cria e envia a tag da versão antes de publicar. Sem isso, o electron-builder
      # tenta criar a release já publicada apontando pra uma tag que ainda não existe,
      # e a API do GitHub às vezes rejeita isso com "Published releases must have a
      # valid tag" (422) mesmo sem nenhuma regra de proteção configurada. Com a tag já
      # existindo de verdade, a criação da release aponta pra uma referência real.
      - name: Criar e enviar a tag da versão (se ainda não existir)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ needs.check-version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG já existe no remoto, pulando criação."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      # NÃO usar "--publish always". O electron-builder sobe os arquivos em
      # paralelo e cada upload cria a release por conta própria se ela ainda não
      # existir. No log de três releases seguidas apareceu
      # "creating GitHub release  reason=release doesn't exist" DUAS vezes no
      # mesmo milissegundo: as duas chamadas corriam juntas, uma perdia, e o
      # upload dela morria em silêncio — com o processo saindo com código 0.
      # Sobrava só o .blockmap, que por ser pequeno ganhava a corrida.
      - name: Empacotar instalador (sem publicar)
        run: npx electron-builder --win --publish never

      - name: Conferir os arquivos gerados
        shell: bash
        run: |
          ls -la release/
          VERSION=$(node -p "require('./package.json').version")
          test -f "release/latest.yml" || { echo "::error::electron-builder não gerou release/latest.yml"; exit 1; }
          test -f "release/Afiliado-Pro-Setup-$VERSION.exe" || { echo "::error::instalador não encontrado em release/"; exit 1; }

      # Upload explícito e sequencial. gh release upload é síncrono e falha com
      # erro de verdade — ao contrário do publisher do electron-builder, que
      # engolia a falha.
      - name: Publicar release e enviar os arquivos
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes "Atualização automática do Afiliado Pro."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber             "release/Afiliado-Pro-Setup-$VERSION.exe"             "release/Afiliado-Pro-Setup-$VERSION.exe.blockmap"             "release/latest.yml"

      # electron-builder pode terminar com exit code 0 mesmo se um upload de asset
      # falhar no meio do caminho (já aconteceu: só o .blockmap subiu, sem o .exe
      # nem o latest.yml, e o job ficou verde do mesmo jeito). Checa de verdade
      # antes de considerar a release publicada.
      - name: Verifica se a release ficou completa (latest.yml presente)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'latest.yml'; then
            echo "OK: latest.yml presente na release v$VERSION"
          else
            echo "::error::Release v$VERSION publicada sem latest.yml — o auto-updater não vai encontrar essa versão. Provavelmente uma falha de upload no meio do processo do electron-builder."
            exit 1
          fi
